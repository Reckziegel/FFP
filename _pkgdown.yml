reference:
    - title: Full Information
      desc: Functions that completely describe a distribution.
      contents:
      - crisp
      - exp_decay
      - kernel_normal

    - title: Partial Information
      desc: Functions that partially describe a distribution.
      contents:
      - kernel_entropy
      - double_decay

    - title: Views on the Market - Helper Functions
      desc: Functions that help construct views on different market aspects.
      contents:
      - view_on_mean
      - view_on_covariance
      - view_on_correlation
      - view_on_volatility
      - view_on_rank
      - view_on_copula
      - view_on_marginal_distribution
      - view_on_joint_distribution

    - title: Views on the Market - Constructor Functions
      desc: High-level view constructors for different market constraints.
      contents:
      - ffp_view
      - view_mean
      - view_covariance
      - view_correlation
      - view_volatility
      - view_rank
      - view_probability
      - view_quantile
      - view_variance
      - view_median

    - title: Prior Specification
      desc: Functions to specify prior distributions using different approaches.
      contents:
      - ffp_prior
      - prior_crisp
      - prior_uniform
      - prior_exp_decay
      - prior_rolling_window
      - prior_kernel
      - prior_custom
      - prior_mixture
      - prior_product

    - title: Optimization & Fitting
      desc: Minimum Relative Entropy and model fitting.
      contents:
      - entropy_pooling
      - entropy_solver_control
      - ffp_fit
      - ffp_model
      - relative_entropy

    - title: FFP Operations
      desc: Functions to extract information from fitted models and objects.
      contents:
      - ffp_probabilities
      - ffp_moments
      - ffp_stats
      - ffp_risk
      - ffp_diagnostics
      - ffp_opinion_pooling
      - summary.ffp_fit
      - summary.ffp_opinion_pool

    - title: Utilities
      desc: Functions to manipulate and transform data.
      contents:
      - bind_probs
      - bind_views
      - bootstrap_scenarios
      - average_ffp
      - fit_to_moments
      - ens
      - empirical_stats
      - half_life

    - title: Visualization
      desc: Functions to explore `ffp` objects with help of `ggplot2`.
      contents:
      - autoplot.ffp
      - autoplot.ffp_fit
      - scenario_density

    - title: Class
      desc: Functions to manipulate `ffp` objects.
      contents:
      - ffp
      - as_ffp
      - is_ffp

    - title: Data
      contents:
      - db
      - db_tbl
